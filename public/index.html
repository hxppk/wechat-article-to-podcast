<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>微信文章转播客</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Background -->
  <div class="bg-overlay"></div>

  <div class="container">
    <!-- User Section -->
    <section id="user-section" class="user-section">
      <!-- 未登录状态 -->
      <div id="guest-bar" class="user-bar guest-bar">
        <span class="user-icon">👤</span>
        <span class="user-text">游客模式</span>
        <span class="user-quota" id="guest-quota"></span>
        <button class="login-btn" onclick="openAuthModal('login')">登录</button>
        <button class="register-btn" onclick="openAuthModal('register')">注册</button>
      </div>
      <!-- 已登录状态 -->
      <div id="user-bar" class="user-bar logged-in-bar" style="display: none;">
        <span class="user-icon">👤</span>
        <span class="user-text" id="user-phone"></span>
        <span class="user-tier" id="user-tier"></span>
        <span class="user-quota" id="user-quota"></span>
        <button class="logout-btn" onclick="handleLogout()">退出</button>
      </div>
      <!-- 访客提示 -->
      <div id="guest-warning" class="guest-warning" style="display: none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>访客播客仅保留 30 分钟，<a href="javascript:openAuthModal('register')">注册</a>可保留 7 天</span>
      </div>
    </section>

    <!-- Header -->
    <header class="header">
      <div class="badge">
        <span class="badge-dot"></span>
        AI Audio Engine V2.0 Active
      </div>
      <h1>微信文章<span class="gradient-text">转播客</span></h1>
      <p class="subtitle">输入公众号文章链接，一键生成双人对话播客，让阅读变成聆听。</p>
    </header>

    <!-- Input Section -->
    <section class="input-section">
      <div class="input-wrapper">
        <div class="input-group">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
          <input type="text" id="article-url" placeholder="粘贴微信公众号文章链接，如 https://mp.weixin.qq.com/s/...">
        </div>
        <button id="convert-btn" class="convert-btn">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"></path>
          </svg>
          <span>开始转换</span>
        </button>
      </div>
<div class="input-hint">
        <span class="hint-dot"></span>
        支持微信公众号文章链接 (WeChat Official Accounts)
      </div>
    </section>

    <!-- Status Section -->
    <section id="status-section" class="status-section" style="display: none;">
      <div class="status-card">
        <div class="status-spinner"></div>
        <div class="status-info">
          <p id="status-text" class="status-text">正在处理...</p>
          <p id="status-eta" class="status-eta"></p>
        </div>
      </div>
      <div class="progress-bar">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
    </section>

    <!-- Error Section -->
    <section id="error-section" class="error-section" style="display: none;">
      <div class="error-card">
        <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <p id="error-text" class="error-text"></p>
        <button id="retry-btn" class="retry-btn">重试</button>
      </div>
    </section>

    <!-- Podcast List -->
    <section class="podcast-section">
      <div class="section-header">
        <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="22"></line>
        </svg>
        <h2>播客列表</h2>
        <span id="podcast-count" class="podcast-count">0</span>
      </div>
      <div id="podcast-list" class="podcast-list">
        <div class="empty-hint">
          <p>暂无播客，快去转换第一篇文章吧！</p>
        </div>
      </div>
    </section>
  </div>

  <!-- Detail Drawer Overlay -->
  <div id="detail-overlay" class="detail-overlay" style="display: none;"></div>

  <!-- Detail Drawer -->
  <section id="detail-drawer" class="detail-drawer" style="display: none;">
    <div class="detail-header">
      <button id="detail-close-btn" class="detail-close-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
      <button id="detail-share-btn" class="detail-share-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="18" cy="5" r="3"></circle>
          <circle cx="6" cy="12" r="3"></circle>
          <circle cx="18" cy="19" r="3"></circle>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
        </svg>
      </button>
    </div>
    <div class="detail-content">
      <h2 id="detail-title" class="detail-title"></h2>
      <p id="detail-account" class="detail-account"></p>
      <div class="detail-description-wrapper">
        <p id="detail-description" class="detail-description"></p>
      </div>
      <div class="detail-actions-row">
        <button id="detail-source-btn" class="detail-source-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          查看原文
        </button>
        <div class="detail-speed-wrapper">
          <button id="detail-speed-btn" class="detail-speed-btn">
            <span id="detail-speed-text">1x</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
          <div id="detail-speed-menu" class="detail-speed-menu" style="display: none;">
            <button data-speed="0.5">0.5x</button>
            <button data-speed="0.75">0.75x</button>
            <button data-speed="1" class="active">1x</button>
            <button data-speed="1.25">1.25x</button>
            <button data-speed="1.5">1.5x</button>
            <button data-speed="2">2x</button>
          </div>
        </div>
      </div>
      <div class="detail-time-row">
        <span id="detail-current-time">0:00</span>
        <span id="detail-total-time">0:00</span>
      </div>
      <div class="detail-progress-wrapper">
        <input type="range" id="detail-progress" class="detail-progress" value="0" min="0" max="100">
      </div>
      <div class="detail-controls">
        <button id="detail-backward-btn" class="detail-skip-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M1 4v6h6"></path>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
          </svg>
          <span class="skip-label">15</span>
        </button>
        <button id="detail-play-btn" class="detail-play-btn">
          <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="6 3 20 12 6 21 6 3"></polygon>
          </svg>
          <svg class="pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
            <rect x="6" y="4" width="4" height="16"></rect>
            <rect x="14" y="4" width="4" height="16"></rect>
          </svg>
        </button>
        <button id="detail-forward-btn" class="detail-skip-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M23 4v6h-6"></path>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
          <span class="skip-label">30</span>
        </button>
      </div>
    </div>
  </section>

  <!-- Toast -->
  <div id="toast" class="toast" style="display: none;"></div>

  <!-- Auth Modal -->
  <div id="auth-overlay" class="auth-overlay" style="display: none;">
    <div id="auth-modal" class="auth-modal">
      <button class="auth-close-btn" onclick="closeAuthModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <h2 id="auth-title">登录</h2>
      <form id="auth-form" onsubmit="handleAuthSubmit(event)">
        <div class="auth-field">
          <label for="auth-phone">手机号</label>
          <input type="tel" id="auth-phone" placeholder="请输入手机号" maxlength="11" required>
        </div>
        <div class="auth-field">
          <label for="auth-password">密码</label>
          <input type="password" id="auth-password" placeholder="请输入密码（至少 6 位）" minlength="6" required>
        </div>
        <div id="auth-error" class="auth-error" style="display: none;"></div>
        <button type="submit" class="auth-submit-btn" id="auth-submit-btn">登录</button>
      </form>
      <p class="auth-switch">
        <span id="auth-switch-text">还没有账号？</span>
        <a href="javascript:void(0)" id="auth-switch-link" onclick="toggleAuthMode()">去注册</a>
      </p>
    </div>
  </div>

  <!-- Player Section -->
  <section id="player-section" class="player-section" style="display: none;">
    <div class="player-progress-wrapper">
      <input type="range" id="progress-slider" class="player-progress" value="0" min="0" max="100">
    </div>
    <div class="player-content">
      <!-- Left: Track Info -->
      <div class="player-info">
        <div class="player-visualizer">
          <span class="bar bar1"></span>
          <span class="bar bar2"></span>
          <span class="bar bar3"></span>
        </div>
        <div class="player-text">
          <h4 id="player-title"></h4>
          <p id="player-meta"><span id="player-account"></span> • <span id="current-time">0:00</span> / <span id="total-time">0:00</span></p>
        </div>
      </div>
      <!-- Center: Controls (Desktop) -->
      <div class="player-controls">
        <button class="skip-btn" id="prev-btn" title="上一曲">
          <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
            <polygon points="19 20 9 12 19 4 19 20"></polygon>
            <rect x="5" y="4" width="2" height="16"></rect>
          </svg>
        </button>
        <button id="play-btn" class="play-btn">
          <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="6 3 20 12 6 21 6 3"></polygon>
          </svg>
          <svg class="pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
            <rect x="6" y="4" width="4" height="16"></rect>
            <rect x="14" y="4" width="4" height="16"></rect>
          </svg>
        </button>
        <button class="skip-btn" id="next-btn" title="下一曲">
          <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
            <polygon points="5 4 15 12 5 20 5 4"></polygon>
            <rect x="17" y="4" width="2" height="16"></rect>
          </svg>
        </button>
      </div>
      <!-- Right: Actions -->
      <div class="player-actions">
        <select id="speed-select" class="speed-select">
          <option value="0.5">0.5x</option>
          <option value="0.75">0.75x</option>
          <option value="1" selected>1x</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2x</option>
        </select>
        <button id="download-btn" class="download-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </button>
        <!-- Mobile Play Button -->
        <button id="mobile-play-btn" class="play-btn mobile-play-btn">
          <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="6 3 20 12 6 21 6 3"></polygon>
          </svg>
          <svg class="pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
            <rect x="6" y="4" width="4" height="16"></rect>
            <rect x="14" y="4" width="4" height="16"></rect>
          </svg>
        </button>
      </div>
    </div>
    <audio id="audio-player"></audio>
  </section>

  <script src="script.js"></script>
</body>
</html>
