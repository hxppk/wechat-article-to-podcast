# 瘦云端：caddy + app（前端/任务队列/worker拉取API/音频托管）。
# 无 mihomo/clash 边车（云端零 AI 出站）；AI 全在本地 worker。
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - web

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    user: "1000:1000"
    # 内存上限 = mem+swap 上限（容器禁用 swap）：OOM 只在 cgroup 内杀进程→容器退出→restart 拉起，不拖垮整机
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      NODE_OPTIONS: --max-old-space-size=384
    expose:
      - "8080"
    volumes:
      - /opt/wechat-podcast/data:/app/data
    networks:
      - web

volumes:
  caddy_data:
  caddy_config:

networks:
  web:
