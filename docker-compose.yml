# 瘦云端：caddy + app（前端/任务队列/worker拉取API/音频托管）。
# 无 mihomo/clash 边车（云端零 AI 出站）；AI 全在本地 worker。
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - web

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    user: "1000:1000"
    expose:
      - "8080"
    volumes:
      - /opt/wechat-podcast/data:/app/data
    networks:
      - web

volumes:
  caddy_data:
  caddy_config:

networks:
  web:
