services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - web

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    user: "1000:1000"
    shm_size: "1gb"
    expose:
      - "8080"
    volumes:
      - /opt/wechat-podcast/data:/app/data
    depends_on:
      clash:
        condition: service_healthy
    networks:
      - web
      - internal

  clash:
    image: metacubex/mihomo:Alpine
    restart: unless-stopped
    volumes:
      - ./proxy/config.yaml:/root/.config/mihomo/config.yaml:ro
    healthcheck:
      # mihomo:Alpine 自带 busybox wget；探 external-controller
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/version"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal

volumes:
  caddy_data:
  caddy_config:

networks:
  web:
  internal:
